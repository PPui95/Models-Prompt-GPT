<title>HR Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar + scrollable tab strip, single content column (max 1080px), cards only for actionable blocks */
:root{
  --bg:#fbf7f9; --surface:#ffffff; --surface-2:#f6eef2; --line:#ead9e1;
  --fg:#2a1d24; --muted:#7a6670; --accent:#d6336c; --accent-ink:#ffffff; --accent-soft:#fde3ec;
  --ok:#1f8a5b; --ok-soft:#dcf3e8; --warn:#b26b00; --warn-soft:#fdf0d9; --bad:#c0392b; --bad-soft:#fbe2df;
  --shadow:0 1px 2px rgba(80,20,45,.06),0 4px 14px rgba(80,20,45,.06);
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1216; --surface:#241a1f; --surface-2:#2e2128; --line:#3d2c35;
  --fg:#f5e9ef; --muted:#b39aa6; --accent:#f06595; --accent-ink:#1a0d13; --accent-soft:#4a1f30;
  --ok:#4cc38a; --ok-soft:#163a2a; --warn:#f0b04a; --warn-soft:#3b2c12; --bad:#f07167; --bad-soft:#40201d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1216; --surface:#241a1f; --surface-2:#2e2128; --line:#3d2c35;
  --fg:#f5e9ef; --muted:#b39aa6; --accent:#f06595; --accent-ink:#1a0d13; --accent-soft:#4a1f30;
  --ok:#4cc38a; --ok-soft:#163a2a; --warn:#f0b04a; --warn-soft:#3b2c12; --bad:#f07167; --bad-soft:#40201d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.35rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);min-width:0}
.who b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
main{padding-block:20px 48px;display:grid;gap:20px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.sub{color:var(--muted);font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.82rem}
.stat.hl .n{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.85rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.8rem;letter-spacing:.02em;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.item{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.item .t{font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.clock{font-family:var(--f-display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.checkin{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.bal{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.bal .b{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kanban{display:grid;gap:10px;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h3{font-size:.9rem;display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.grade{font-family:var(--f-display);font-weight:700;font-size:1.1rem;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.notice{padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--fg);font-size:.88rem}
.notice.warn{background:var(--warn-soft)}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea,.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);font-size:.95rem}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.overlay{position:fixed;inset:0;background:rgba(30,10,20,.45);z-index:20;display:grid;place-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:16px;width:min(640px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:.9rem;max-width:calc(100% - 32px)}
.kpi-row{display:grid;grid-template-columns:2fr .8fr .9fr .9fr auto;gap:6px;align-items:center}
@media (max-width:560px){.kpi-row{grid-template-columns:1fr 1fr}.kpi-row .kn{grid-column:1/-1}}
.score{display:flex;gap:4px}
.score button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.score button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
@media (prefers-reduced-motion:no-preference){.btn,.score button{transition:filter .15s,border-color .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true">HR</span><span id="org-name">HR Desk</span></div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="เมนูหลัก"></nav>
  </div>
</header>
<main class="wrap" id="app">
  <div class="empty">กำลังโหลดข้อมูลพนักงาน การลา และเวลาเข้างาน…</div>
</main>
<div id="modal-root"></div>

<script>
(() => {
"use strict";
// ---------- constants ----------
const TZ = "Asia/Bangkok";
const LEAVE_TYPES = {
  sick:{label:"ลาป่วย", note:"ได้รับค่าจ้างไม่เกิน 30 วัน/ปี (ม.32, 57)"},
  personal:{label:"ลากิจ", note:"ไม่น้อยกว่า 3 วัน/ปี (ม.34)"},
  vacation:{label:"พักร้อน", note:"ทำงานครบ 1 ปี ได้ไม่น้อยกว่า 6 วัน (ม.30)"},
  maternity:{label:"ลาคลอด", note:"ไม่เกิน 98 วัน/ครรภ์ (ม.41)"},
  unpaid:{label:"ลาไม่รับค่าจ้าง", note:"ตามที่หัวหน้าอนุมัติ"}
};
const DEFAULT_SETTINGS = {
  orgName:"HR Desk", workStart:"08:30", workEnd:"17:30", graceMin:0,
  quotas:{sick:30, personal:3, vacation:6, maternity:98},
  kpiWeight:70, trainingTarget:12
};
const STAGES = [
  ["applied","สมัคร"],["screen","คัดกรอง"],["interview","สัมภาษณ์"],["offer","เสนองาน"],["hired","รับเข้าทำงาน"],["rejected","ไม่ผ่าน"]
];
const DEFAULT_COMPS = ["ความรับผิดชอบ","การทำงานเป็นทีม","การสื่อสาร","การแก้ปัญหา","การเรียนรู้และพัฒนาตนเอง"];
const DEFAULT_ONBOARD = ["เซ็นสัญญาจ้างและเอกสารบุคคล","แจ้งเข้าประกันสังคม","เปิดอีเมลและบัญชีระบบงาน","รับอุปกรณ์ทำงาน","ปฐมนิเทศนโยบายบริษัท","แนะนำทีมและพี่เลี้ยง","ตั้งเป้าหมายช่วงทดลองงาน","ประเมินผลก่อนครบทดลองงาน 119 วัน"];
const ROLE_LABEL = {hr:"HR", manager:"หัวหน้า", staff:"พนักงาน"};
const STATUS_LABEL = {active:["ทำงาน","p-ok"], probation:["ทดลองงาน","p-warn"], resigned:["ลาออก","p-mute"]};
const TABS = [
  ["home","ภาพรวม"],["people","พนักงาน"],["time","เข้างาน"],["leave","การลา"],["review","ประเมินผล"],["hiring","สรรหา"],["training","อบรม"],["settings","ตั้งค่า"]
];

// ---------- state ----------
const S = {employees:{}, attendance:{}, leaves:{}, reviews:{}, candidates:{}, onboarding:{}, trainings:{}, settings:{...DEFAULT_SETTINGS}};
const loaded = new Set();
let db = null, user = null, myId = null, isEditor = false, viewAs = "";
let attMonth = monthKey(new Date()), attUnsub = null, attDate = todayKey();
let reviewPeriod = "", timedOut = false, fatal = "";

// ---------- helpers ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function partsTZ(d){const o={};new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(d).forEach(p=>o[p.type]=p.value);return o;}
function todayKey(d=new Date()){const p=partsTZ(d);return `${p.year}-${p.month}-${p.day}`;}
function monthKey(d=new Date()){const p=partsTZ(d);return `${p.year}-${p.month}`;}
function nowHM(){const p=partsTZ(new Date());return `${p.hour==="24"?"00":p.hour}:${p.minute}`;}
function thDate(k){if(!k)return"-";const[y,m,d]=k.split("-").map(Number);return new Date(Date.UTC(y,m-1,d||1)).toLocaleDateString("th-TH",{timeZone:"UTC",day:"numeric",month:"short",year:"2-digit"});}
function thMonth(k){const[y,m]=k.split("-").map(Number);return new Date(Date.UTC(y,m-1,1)).toLocaleDateString("th-TH",{timeZone:"UTC",month:"long",year:"numeric"});}
function toMin(hm){const[h,m]=String(hm||"0:0").split(":").map(Number);return h*60+(m||0);}
function workDays(a,b){if(!a||!b)return 0;let n=0;const s=new Date(a+"T00:00:00Z"),e=new Date(b+"T00:00:00Z");for(let d=s;d<=e;d=new Date(d.getTime()+864e5)){const w=d.getUTCDay();if(w!==0&&w!==6)n++;}return n;}
function serviceYears(start){if(!start)return 0;return (new Date(todayKey()+"T00:00:00Z")-new Date(start+"T00:00:00Z"))/(365.25*864e5);}
function serviceText(start){const y=serviceYears(start);if(y<0)return"ยังไม่เริ่มงาน";const yy=Math.floor(y),mm=Math.floor((y-yy)*12);return (yy?yy+" ปี ":"")+mm+" เดือน";}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmt(n,d=0){return Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:d,minimumFractionDigits:d});}
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
const empList = () => Object.values(S.employees).sort((a,b)=>String(a.code||"").localeCompare(String(b.code||""))||String(a.name).localeCompare(String(b.name)));
const empName = id => S.employees[id]?.name || "ไม่ระบุ";
const activeEmps = () => empList().filter(e=>e.status!=="resigned");

// ---------- roles ----------
function myEmp(){ if(!myId) return null; return Object.values(S.employees).find(e=>e.userId===myId) || null; }
function ctx(){
  const real = myEmp();
  const realHR = isEditor || real?.role==="hr";
  if (realHR && viewAs && S.employees[viewAs]) {
    const e = S.employees[viewAs];
    return {emp:e, role:e.role||"staff", isHR:e.role==="hr", previewing:true, realHR};
  }
  if (realHR) return {emp:real, role:"hr", isHR:true, previewing:false, realHR};
  if (real) return {emp:real, role:real.role||"staff", isHR:false, previewing:false, realHR};
  return {emp:null, role:"none", isHR:false, previewing:false, realHR};
}
function teamIds(c){ if(!c.emp) return []; return Object.values(S.employees).filter(e=>e.managerId===c.emp.id).map(e=>e.id); }
function visibleEmpIds(c){
  if (c.isHR) return activeEmps().map(e=>e.id);
  const ids = c.emp ? [c.emp.id] : [];
  if (c.role==="manager") ids.push(...teamIds(c));
  return ids;
}
function canApprove(c, leave){ const e=S.employees[leave.empId]; if(!e) return c.isHR; if(c.emp && leave.empId===c.emp.id) return false; return c.isHR || (c.emp && e.managerId===c.emp.id); }
function tabsFor(c){
  if (c.isHR) return TABS.map(t=>t[0]);
  const t = ["home","people","time","leave","review","training"];
  if (c.role==="manager") t.splice(5,0,"hiring");
  return t;
}

// ---------- db ----------
async function write(path, data, mode="set"){
  if(!db){toast("ยังเชื่อมต่อฐานข้อมูลไม่ได้");return false;}
  try{ const ref=db.doc(path); if(mode==="delete") await ref.delete(); else if(mode==="update") await ref.update(data); else await ref.set(data); return true; }
  catch(e){ const m={not_granted:"บัญชีนี้ไม่มีสิทธิ์บันทึก ขอสิทธิ์ผู้ร่วมแก้ไข (Contributor) จาก HR", quota_exceeded:"พื้นที่จัดเก็บเต็ม ลบข้อมูลเก่าก่อน"}[e?.code]; toast(m||"บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง"); return false; }
}
function listen(col, q){
  return q.onSnapshot(snap=>{
    const map={}; snap.docs.forEach(d=>{map[d.id]={id:d.id,...d.data()};});
    if(col==="settings") S.settings={...DEFAULT_SETTINGS,...(map.main||{}),quotas:{...DEFAULT_SETTINGS.quotas,...(map.main?.quotas||{})}};
    else S[col]=map;
    if(!snap.metadata.fromCache) loaded.add(col);
    render();
  }, err=>{ loaded.add(col); if(err?.code==="not_granted"||err?.code==="revoked") fatal="บัญชีนี้ยังไม่ได้รับสิทธิ์เปิดข้อมูล HR ขอให้ HR แชร์ลิงก์ให้ก่อน"; render(); });
}
function subscribeAttendance(){
  if(attUnsub) attUnsub();
  attUnsub = listen("attendance", db.collection("attendance").where("month","==",attMonth).limit(1000));
}

// ---------- modal ----------
function modal(title, body, onSubmit, submitLabel="บันทึก"){
  const root=$("#modal-root");
  root.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form class="modal" id="mform"><h2>${esc(title)}</h2>${body}<div class="acts"><button type="button" class="btn ghost" data-close>ยกเลิก</button>${onSubmit?`<button class="btn pri" type="submit">${esc(submitLabel)}</button>`:""}</div></form></div>`;
  const f=$("#mform");
  f.addEventListener("submit",async ev=>{ev.preventDefault(); const ok=await onSubmit(new FormData(f), f); if(ok!==false) closeModal();});
  root.querySelector("[data-close]").onclick=closeModal;
  root.querySelector(".overlay").addEventListener("click",ev=>{if(ev.target.classList.contains("overlay"))closeModal();});
  const first=f.querySelector("input,select,textarea"); if(first) first.focus();
}
function closeModal(){ $("#modal-root").innerHTML=""; }
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
function confirmBox(text, label, fn){ modal("ยืนยัน", `<p>${esc(text)}</p>`, async()=>{await fn();}, label); }

// ---------- views ----------
function pill(text, cls){return `<span class="pill ${cls}">${esc(text)}</span>`;}
function leavePill(s){return s==="approved"?pill("อนุมัติ","p-ok"):s==="rejected"?pill("ไม่อนุมัติ","p-bad"):pill("รออนุมัติ","p-warn");}
function gradeOf(t){return t>=90?["A","ดีเยี่ยม","p-ok"]:t>=80?["B","ดี","p-ok"]:t>=70?["C","ตามเป้าหมาย","p-acc"]:t>=60?["D","ต้องพัฒนา","p-warn"]:["E","ต่ำกว่ามาตรฐาน","p-bad"];}
function attDoc(empId, mk=attMonth){return S.attendance[`${empId}_${mk}`];}
function attToday(empId){ const d=attDoc(empId, monthKey()); return d?.days?.[todayKey().slice(8)] || null; }
function isLate(inHM){return toMin(inHM) > toMin(S.settings.workStart)+Number(S.settings.graceMin||0);}

function leaveUsage(empId, year){
  const u={}; Object.keys(LEAVE_TYPES).forEach(k=>u[k]={used:0,pending:0});
  Object.values(S.leaves).filter(l=>l.empId===empId && String(l.start).startsWith(year)).forEach(l=>{
    if(!u[l.type]) return; if(l.status==="approved") u[l.type].used+=Number(l.days||0); else if(l.status==="pending") u[l.type].pending+=Number(l.days||0);
  });
  return u;
}
function quotaFor(emp, type){
  const q=S.settings.quotas;

async function doCheck(kind){
  const c=ctx(); if(!c.emp) return;
  const mk=monthKey(), dd=todayKey().slice(8), path=`attendance/${c.emp.id}_${mk}`;
  const cur=attDoc(c.emp.id,mk); const days={...(cur?.days||{})}; const t=nowHM();
  if(kind==="in"){ if(days[dd]) return; days[dd]={in:t, late:isLate(t)}; }

  if(mk!==attMonth){attMonth=mk;subscribeAttendance();}

}

function viewReview(c){
  const ids=new Set(visibleEmpIds(c));
  const canWrite=id=>!c.previewing&&(c.isHR||(c.role==="manager"&&S.employees[id]?.managerId===c.emp?.id));
  const all=Object.values(S.reviews).filter(r=>ids.has(r.empId)&&(canWrite(r.empId)||r.status==="final"));
  const periods=[...new Set(all.map(r=>r.period))].sort().reverse();
  if(!reviewPeriod||!periods.includes(reviewPeriod)) reviewPeriod=periods[0]||"";
  const list=all.filter(r=>r.period===reviewPeriod).sort((a,b)=>b.total-a.total);
  const kw=Number(S.settings.kpiWeight);
  let html=`<div class="sec-head"><div><h2>ประเมินผลงาน</h2><div class="sub">คะแนนรวม = KPI ${kw}% + Competency ${100-kw}% · เกรด A ≥90 · B ≥80 · C ≥70 · D ≥60 · E &lt;60</div></div><div class="row">${periods.length?`<select class="inp" id="rv-period" style="width:auto" aria-label="รอบประเมิน">${periods.map(p=>`<option ${p===reviewPeriod?"selected":""}>${esc(p)}</option>`).join("")}</select>`:""}${(c.isHR||c.role==="manager")&&!c.previewing?`<button class="btn pri" data-act="new-review">สร้างแบบประเมิน</button>`:""}</div></div>`;
  if(!list.length) return html+`<div class="empty">ยังไม่มีผลประเมิน${(c.isHR||c.role==="manager")?" กด “สร้างแบบประเมิน” เพื่อเริ่มรอบแรก":""}</div>`;
  if(list.length>1){const dist={A:0,B:0,C:0,D:0,E:0};list.forEach(r=>dist[gradeOf(r.total)[0]]++);html+=`<section class="stats">${Object.entries(dist).map(([g,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">เกรด ${g}</div></div>`).join("")}</section>`;}
  html+=`<div class="tbl-wrap"><table><thead><tr><th>เกรด</th><th>พนักงาน</th><th class="num">KPI</th><th class="num">Competency</th><th class="num">รวม</th><th>สถานะ</th><th></th></tr></thead><tbody>${list.map(r=>{const g=gradeOf(r.total);return `<tr><td><span class="grade pill ${g[2]}">${g[0]}</span></td><td><b>${esc(empName(r.empId))}</b><div class="small muted">${g[1]} · ผู้ประเมิน ${esc(r.reviewer?empName(r.reviewer):"HR")}</div></td><td class="num">${fmt(r.kpiPct,1)}%</td><td class="num">${fmt(r.compPct,1)}%</td><td class="num"><b>${fmt(r.total,1)}</b></td><td>${r.status==="final"?pill("ยืนยันแล้ว","p-ok"):pill("ฉบับร่าง","p-mute")}</td><td><button class="btn sm" data-act="${canWrite(r.empId)?"edit-review":"view-review"}" data-id="${r.id}">${canWrite(r.empId)?"แก้ไข":"ดู"}</button></td></tr>`;}).join("")}</tbody></table></div>`;
  return html;
}
function calcReview(kpis, comps){
  const kw=Number(S.settings.kpiWeight);
  const sw=kpis.reduce((s,k)=>s+Number(k.weight||0),0);
  const kpiPct=sw?kpis.reduce((s,k)=>s+Number(k.weight||0)*Math.min(1.2,Number(k.target)?Number(k.actual||0)/Number(k.target):0),0)/sw*100:0;
  const sc=comps.filter(x=>x.score); const compPct=sc.length?sc.reduce((s,x)=>s+Number(x.score),0)/sc.length/5*100:0;
  const total=Math.min(100,kpiPct*kw/100+compPct*(100-kw)/100);
  return {kpiPct,compPct,total,sw};
}

function currentTab(c){const h=location.hash.slice(1);const allowed=tabsFor(c);return allowed.includes(h)?h:"home";}
let pendingRender=false;
document.addEventListener("focusout",()=>{ if(pendingRender) setTimeout(()=>{ const a=document.activeElement; if(!(a&&$("#app").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){pendingRender=false;render();} },0); });
function render(){
  const app=$("#app");
  const ae=document.activeElement;
  if(ae&&app.contains(ae)&&/INPUT|TEXTAREA/.test(ae.tagName)&&ae.closest("form")){pendingRender=true;return;}
  document.title = (S.settings.orgName && S.settings.orgName!=="HR Desk") ? `${S.settings.orgName} · HR Desk` : "HR Desk";
  $("#org-name").textContent=S.settings.orgName||"HR Desk";
  if(fatal){app.innerHTML=`<div class="empty">${esc(fatal)}</div>`;$("#tabs").innerHTML="";return;}
  if(!db){app.innerHTML=`<div class="empty">${timedOut?"เปิดฐานข้อมูลไม่ได้ เข้าสู่ระบบ claude.ai แล้วเปิดลิงก์นี้อีกครั้ง":"กำลังเชื่อมต่อฐานข้อมูล…"}</div>`;return;}
  if(!loaded.has("employees")){app.innerHTML=`<div class="empty">${timedOut?"ยังโหลดข้อมูลไม่ได้ ตรวจการเชื่อมต่ออินเทอร์เน็ต ข้อมูลจะขึ้นเองเมื่อเชื่อมต่อได้":"กำลังโหลดข้อมูลพนักงาน…"}</div>`;return;}
  const c=ctx();
  const who=$("#who");
  who.innerHTML = c.emp||c.isHR ? `${c.previewing?pill("ตัวอย่างมุมมอง","p-warn"):""}<b>${esc(c.emp?.name||"ผู้ดูแลระบบ")}</b>${pill(c.isHR?"HR":ROLE_LABEL[c.role]||"",c.isHR?"p-acc":"p-mute")}${c.previewing?`<button class="btn sm" data-act="exit-preview">กลับมุมมอง HR</button>`:""}` : "";
  if(!c.emp && !c.isHR){ $("#tabs").innerHTML=""; app.innerHTML=viewClaim(); return; }
  const tab=currentTab(c);
  $("#tabs").innerHTML=tabsFor(c).map(k=>`<a href="#${k}" ${k===tab?'aria-current="page"':""}>${TABS.find(t=>t[0]===k)[1]}</a>`).join("");
  const scroll=window.scrollY; const focusId=document.activeElement?.id;
  const views={home:viewHome,people:viewPeople,time:viewTime,leave:viewLeave,review:viewReview,hiring:viewHiring,training:viewTraining,settings:viewSettings};
  app.innerHTML=views[tab](c);
  if(focusId&&document.getElementById(focusId)) document.getElementById(focusId).focus();
  window.scrollTo(0,scroll);
}

document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="att-month"&&t.value){attMonth=t.value;attDate=`${t.value}-01`;loaded.delete("attendance");subscribeAttendance();render();}
  else if(t.id==="att-date"&&t.value){attDate=t.value;render();}
  else if(t.id==="rv-period"){reviewPeriod=t.value;render();}
  else if(t.id==="import-file"&&t.files?.[0]&&localMode){ try{ const o=JSON.parse(await t.files[0].text()); if(!o||typeof o!=="object"||!o.employees) throw 0; db.importAll(o); toast("นำเข้าข้อมูลแล้ว"); }catch(err){ toast("ไฟล์นี้ไม่ใช่ไฟล์สำรองของ HR Desk"); } t.value=""; }
  else if(t.id==="viewas"){viewAs=t.value;location.hash="home";render();}
  else if(t.dataset.act==="ob-toggle"){const o=S.onboarding[t.dataset.id];const items=o.items.map((it,i)=>i==+t.dataset.i?{...it,done:t.checked}:it);await write(`onboarding/${o.id}`,{items},"update");}
});
document.addEventListener("input",e=>{ if(e.target.closest("#kpis")) updReviewSum(); });
document.addEventListener("submit",async e=>{
  if(e.target.id!=="set-form") return; e.preventDefault();
  const fd=new FormData(e.target); const n=k=>Number(fd.get(k));
  const data={orgName:fd.get("orgName").trim()||"HR Desk", workStart:fd.get("workStart"), workEnd:fd.get("workEnd"), graceMin:n("graceMin"), quotas:{sick:n("q_sick"),personal:n("q_personal"),vacation:n("q_vacation"),maternity:n("q_maternity")}, kpiWeight:Math.min(100,Math.max(0,n("kpiWeight"))), trainingTarget:n("trainingTarget")};
  if(await write("settings/main",data)) toast("บันทึกการตั้งค่าแล้ว");
});
document.addEventListener("click",async e=>{
  const sb=e.target.closest(".score button");
  if(sb&&draft&&!sb.disabled){ const ci=+sb.closest(".score").dataset.ci; draft.comps[ci].score=+sb.dataset.score; sb.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===sb)); updReviewSum(); return; }
  const b=e.target.closest("[data-act]"); if(!b||b.tagName==="INPUT") return;
  const act=b.dataset.act, id=b.dataset.id, c=ctx();
  switch(act){
    case "checkin": b.disabled=true; await doCheck("in"); break;
    case "checkout": b.disabled=true; await doCheck("out"); break;
    case "new-leave": modal("ขอลา", leaveForm(c), saveLeave, "ส่งคำขอ"); bindLeaveCalc(); break;
    case "approve": case "reject": { if(await write(`leaves/${id}`,{status:act==="approve"?"approved":"rejected", decidedBy:c.emp?.id||"hr", decidedAt:new Date().toISOString()},"update")) toast(act==="approve"?"อนุมัติการลาแล้ว":"ไม่อนุมัติการลา"); break; }
    case "cancel-leave": confirmBox("ยกเลิกคำขอลานี้?","ยกเลิกคำขอ",async()=>{if(await write(`leaves/${id}`,null,"delete"))toast("ยกเลิกคำขอลาแล้ว");}); break;
    case "new-emp": modal("เพิ่มพนักงาน", empForm(), saveEmp()); break;
    case "edit-emp": modal("แก้ไขข้อมูลพนักงาน", empForm(S.employees[id]), saveEmp(id)); break;
    case "del-emp": closeModal(); confirmBox(`ลบ ${empName(id)} ออกจากทะเบียน? ประวัติการลาและการประเมินจะยังอยู่ ถ้าพนักงานลาออก แนะนำให้เปลี่ยนสถานะเป็น “ลาออก” แทน`,"ลบพนักงาน",async()=>{if(await write(`employees/${id}`,null,"delete")){await write(`onboarding/${id}`,null,"delete");toast("ลบพนักงานแล้ว");}}); break;
    case "unlink": if(await write(`employees/${id}`,{userId:null},"update")){closeModal();toast("ยกเลิกการผูกบัญชีแล้ว");} break;
    case "link-me": { const v=$("#link-sel")?.value; if(v&&myId&&await write(`employees/${v}`,{userId:myId},"update")) toast("ผูกบัญชีแล้ว"); break; }
    case "claim": { const v=$("#claim-sel")?.value; if(!myId){toast("ระบบยังระบุบัญชีของคุณไม่ได้ ลองเปิดลิงก์ใหม่");break;} if(v&&await write(`employees/${v}`,{userId:myId},"update")){toast("ผูกบัญชีเรียบร้อย");location.hash="home";} break; }
    case "exit-preview": viewAs=""; render(); break;
    case "new-review": openReview(null,false); break;
    case "edit-review": openReview(id,false); break;
    case "view-review": openReview(id,true); break;
    case "add-kpi": syncKpis(); draft.kpis.push({name:"",weight:0,target:100,actual:0}); $("#kpis").innerHTML=draft.kpis.map((k,i)=>kpiRow(k,i)).join(""); updReviewSum(); break;
    case "rm-kpi": syncKpis(); draft.kpis.splice(+b.dataset.i,1); $("#kpis").innerHTML=draft.kpis.map((k,i)=>kpiRow(k,i)).join(""); updReviewSum(); break;
    case "new-cand": modal("เพิ่มผู้สมัคร", candForm(), saveCand()); break;
    case "edit-cand": modal("แก้ไขผู้สมัคร", candForm(S.candidates[id]), saveCand(id)); break;
    case "del-cand": closeModal(); confirmBox("ลบผู้สมัครรายนี้?","ลบ",async()=>{if(await write(`candidates/${id}`,null,"delete"))toast("ลบผู้สมัครแล้ว");}); break;
    case "stage": await write(`candidates/${id}`,{stage:b.dataset.to},"update"); break;
    case "hire": { const x=S.candidates[id]; const n=activeEmps().length+1; modal("สร้างเป็นพนักงาน", empForm({name:x.name,position:x.position,code:`EMP${String(n).padStart(3,"0")}`,status:"probation",role:"staff"}), async fd=>{const r=await saveEmp()(fd); if(r===false) return false; const e=Object.values(S.employees).find(z=>z.name===fd.get("name").trim()); await write(`candidates/${id}`,{empId:e?.id||"created"},"update");}); break; }

    case "tr-all": document.querySelectorAll("[name=att]").forEach(x=>x.checked=true); break;
    case "export": { const blob=new Blob([JSON.stringify(db.exportAll(),null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`hr-desk-backup-${todayKey()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast("ดาวน์โหลดไฟล์สำรองแล้ว"); break; }
    case "clear-sample": confirmBox("ลบข้อมูลตัวอย่างทั้งหมด? ข้อมูลที่คุณเพิ่มเองจะไม่ถูกลบ","ลบข้อมูลตัวอย่าง",clearSample); break;
  }
});
function saveCand(id){return async fd=>{const old=id?S.candidates[id]:{};const data={...old,name:fd.get("name").trim(),position:fd.get("position").trim(),source:fd.get("source").trim(),contact:fd.get("contact").trim(),interviewAt:fd.get("interviewAt"),stage:fd.get("stage"),note:fd.get("note").trim(),appliedAt:old.appliedAt||todayKey()};delete data.id;if(await write(`candidates/${id||uid("c")}`,data))toast("บันทึกผู้สมัครแล้ว");};}
function saveTr(id){return async fd=>{const old=id?S.trainings[id]:{};const data={...old,course:fd.get("course").trim(),provider:fd.get("provider").trim(),date:fd.get("date"),hours:Number(fd.get("hours")),attendees:fd.getAll("att")};delete data.id;if(await write(`trainings/${id||uid("t")}`,data))toast("บันทึกหลักสูตรแล้ว");};}
async function clearSample(){
  let n=0;
  for(const col of ["leaves","reviews","candidates","onboarding","trainings","attendance","employees"]){
    for(const x of Object.values(S[col]).filter(v=>v.sample)){ try{await db.doc(`${col}/${x.id}`).delete();n++;}catch(e){} }
  }
  // attendance of other months
  try{const snap=await db.collection("attendance").where("sample","==",true).limit(1000).get();for(const d of snap.docs){await db.doc(`attendance/${d.id}`).delete();n++;}}catch(e){}
  viewAs=""; toast(`ลบข้อมูลตัวอย่างแล้ว ${n} รายการ`);
}

let localMode = false;
function localDB(){
  const KEY="hrdesk-data-v1"; let store=null;
  try{ store=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!store||typeof store!=="object") store=JSON.parse(JSON.stringify(SEED));
  const subs=new Set(); const clone=o=>JSON.parse(JSON.stringify(o));
  const persist=()=>{ try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){} subs.forEach(f=>f()); };
  function snap(col,filters){ const c=store[col]||{}; const docs=Object.keys(c).sort().filter(id=>filters.every(([f,v])=>c[id][f]===v)).map(id=>({id,exists:true,data:()=>clone(c[id]),metadata:{fromCache:false,hasPendingWrites:false}})); return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}; }
  const mk=(col,filters)=>({
    where(f,op,v){return mk(col,[...filters,[f,v]]);}, limit(){return this;}, orderBy(){return this;},
    async get(){return snap(col,filters);},
    onSnapshot(next){const f=()=>next(snap(col,filters));subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}
  });
  return {
    collection:col=>mk(col,[]),
    doc(path){const [col,id]=path.split("/"); return {
      async set(d){(store[col]??={})[id]=clone(d);persist();},
      async update(d){(store[col]??={});store[col][id]={...(store[col][id]||{}),...clone(d)};persist();},
      async delete(){if(store[col])delete store[col][id];persist();}
    };},
    exportAll:()=>clone(store),
    importAll(o){store=clone(o);persist();},
    reset(){store=clone(SEED);persist();}
  };
}

// ---------- boot ----------
async function boot(){
  const timer=setTimeout(()=>{timedOut=true;render();},10000);
  const [d,u]=await Promise.all([window.claude?.use("db"),window.claude?.use("user")].map(p=>Promise.resolve(p).catch(()=>null)));
  db=d; user=u;
  if(!db){clearTimeout(timer);timedOut=true;render();return;}
  if(user){ try{myId=await user.id();}catch(e){} try{isEditor=await user.canEdit();}catch(e){} }
  ["employees","leaves","reviews","candidates","onboarding","trainings","settings"].forEach(col=>listen(col, db.collection(col).limit(1000)));
  subscribeAttendance();
  const iv=setInterval(()=>{if(loaded.has("employees")){clearTimeout(timer);clearInterval(iv);}},300);
  render();
}
function bootLocal(){
  localMode=true; db=localDB(); myId="local-user"; isEditor=true;
  const b=document.createElement("div"); b.className="wrap"; b.innerHTML=`<div class="notice" style="margin-top:12px">โหมดใช้งานในเครื่อง: ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น เปิดจากเครื่องอื่นจะไม่เห็นข้อมูลเดียวกัน สำรองข้อมูลได้ที่หน้า <a href="#settings">ตั้งค่า</a></div>`;
  $("#app").before(b);
  ["employees","leaves","reviews","candidates","onboarding","trainings","settings"].forEach(col=>listen(col, db.collection(col).limit(1000)));
  subscribeAttendance(); render();
}
if(window.claude?.use) boot(); else { setTimeout(()=>{ if(window.claude?.use) boot(); else bootLocal(); },800); }
